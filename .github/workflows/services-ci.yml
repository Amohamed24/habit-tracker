name: Services CI

on:
  push:
    branches: [main]
    paths:
      - 'services/**'
      - '.github/workflows/services-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'services/**'
      - '.github/workflows/services-ci.yml'

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # One service failing must not cancel the other.
      fail-fast: false
      matrix:
        service: [auth-service, habit-service]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: services/${{ matrix.service }}/pom.xml

      - name: Verify
        working-directory: services/${{ matrix.service }}
        run: ./mvnw -B verify

      - name: Docker build
        run: docker build -t habitflow-${{ matrix.service }}:ci services/${{ matrix.service }}
