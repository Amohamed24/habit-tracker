spring:
  application:
    name: habit-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:habitflow}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only checks the entities against it.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    # Existing databases (old Hibernate volumes, or auth-service started first) are baselined at 0,
    # so the idempotent V1 still runs on them. A baseline at 1 would skip V1 and never create the tables.
    baseline-on-migrate: true
    baseline-version: 0
    # auth-service shares the habitflow database and public schema until R1b-03.
    table: flyway_schema_history_habit
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Explicit (R1-06a): these bound how long the outbox publisher holds row locks while sending.
      acks: all
      # Explicit (R1-07): the kafka-clients default (MAX_INT). delivery.timeout.ms is the real limit on
      # producer retries; after it the future fails and the outbox row backs off (OutboxBackoff).
      retries: 2147483647
      properties:
        enable.idempotence: true
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 15000
    consumer:
      group-id: habit-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.type.mapping: userRegistered:com.habitflow.habits.event.UserRegisteredEvent

# Outbox publisher (R1-06a). Switch the poll loop off with OUTBOX_PUBLISHER_ENABLED=false.
outbox:
  publisher:
    enabled: ${OUTBOX_PUBLISHER_ENABLED:true}
  # One deadline for all acks of a batch; above delivery.timeout.ms, below the 30 s transaction timeout.
  send-timeout-ms: 20000

server:
  port: 8080

auth-service:
  url: ${AUTH_SERVICE_URL:http://localhost:8081}

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

# Actuator and Prometheus
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}