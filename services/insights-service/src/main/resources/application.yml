spring:
  application:
    name: insights-service
  datasource:
    # Its own database (R1-09a). The defaults point at insights-db's host port 5433 on purpose, so a run
    # without DB_* env vars can never fall back to habit-service's habitflow database on 5432.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:insights}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only checks the entities against it.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    # Same baseline settings as habit-service. The history table is Flyway's default
    # (flyway_schema_history): this database belongs to insights-service alone.
    baseline-on-migrate: true
    baseline-version: 0
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    # HF-18: the only place the habit-events consumer is configured (group id and topic are on
    # HabitEventsListener). HF-19 wraps value-deserializer in ErrorHandlingDeserializer here.
    consumer:
      auto-offset-reset: earliest
      # No timer commits: offsets go through the listener container only.
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        # habit-service sends the outbox JSON as plain strings (StringSerializer), so there is no
        # __TypeId__ header: ignore type headers and always bind to the local envelope record.
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.habitflow.insights.event.EventEnvelope
        spring.json.trusted.packages: com.habitflow.insights.event
    # listener.ack-mode is left at Spring Kafka's default, BATCH: a poll's offsets are committed only after
    # the listener has returned for every record in it, i.e. after each ProjectionService.apply transaction
    # committed. A record whose apply throws is sought back, not committed.

server:
  port: 8082

# Actuator and Prometheus
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
