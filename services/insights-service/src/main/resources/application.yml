spring:
  application:
    name: insights-service
  datasource:
    # Its own database (R1-09a). The defaults point at insights-db's host port 5433 on purpose, so a run
    # without DB_* env vars can never fall back to habit-service's habitflow database on 5432.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:insights}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only checks the entities against it.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    # Same baseline settings as habit-service. The history table is Flyway's default
    # (flyway_schema_history): this database belongs to insights-service alone.
    baseline-on-migrate: true
    baseline-version: 0
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    # HF-18: the only place the habit-events consumer is configured (group id and topic are on
    # HabitEventsListener). Error handling and the dead-letter topic are in config/DeadLetterConfig (HF-19).
    consumer:
      auto-offset-reset: earliest
      # No timer commits: offsets go through the listener container only.
      enable-auto-commit: false
      # Keys are aggregate ids written by StringSerializer, so they always decode; not wrapped.
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # HF-19 (L7): a value JsonDeserializer can't parse no longer throws inside poll(). ErrorHandlingDeserializer
      # returns null and puts the DeserializationException (with the raw bytes) in a header, so the container
      # hands the record to the error handler, which sends it to habit-events.insights-service.DLT.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        # The spring.json.* settings below are passed on to the delegate.
        # habit-service sends the outbox JSON as plain strings (StringSerializer), so there is no
        # __TypeId__ header: ignore type headers and always bind to the local envelope record.
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.habitflow.insights.event.EventEnvelope
        spring.json.trusted.packages: com.habitflow.insights.event
    # listener.ack-mode is left at Spring Kafka's default, BATCH: a poll's offsets are committed only after
    # the listener has returned for every record in it, i.e. after each ProjectionService.apply transaction
    # committed. A record whose apply throws is sought back, not committed, until the error handler's retries
    # are exhausted (HF-20: 4 attempts, 1 s / 2 s / 4 s apart; IllegalArgumentException, JsonProcessingException
    # and DeserializationException are not retried). It is then published to the DLT, and its offset is
    # committed only after that publish succeeded (HF-19).

server:
  port: 8082

# Actuator and Prometheus
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
